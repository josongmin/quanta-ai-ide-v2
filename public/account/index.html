<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Codeflow Lens — Account & Identity</title>
<meta name="theme-color" content="#0a0d12" />
<meta name="color-scheme" content="dark light" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
/* ─────────────────────────────────────────────────────────
   Design tokens — mirrors the parent app (Codeflow Lens)
   ───────────────────────────────────────────────────────── */
:root[data-theme="dark"]{
  --bg-canvas:#0a0d12;
  --bg-surface:#0f141b;
  --bg-surface-muted:#0c1117;
  --bg-overlay:rgba(20,26,34,.72);
  --fg-default:#e6edf3;
  --fg-muted:#9ba6b2;
  --fg-subtle:#6b7682;
  --fg-on-accent:#06120a;
  --border-default:rgba(255,255,255,.10);
  --border-muted:rgba(255,255,255,.05);
  --border-strong:rgba(255,255,255,.18);
  --border-focus:#4f9a5c;
  --accent:#4f9a5c;
  --accent-hi:#6dbe7c;
  --accent-glow:rgba(79,154,92,.35);
  --intent-success-fg:#7bd494;
  --intent-success-bg:rgba(79,154,92,.14);
  --intent-warn-fg:#e0b86b;
  --intent-warn-bg:rgba(224,184,107,.12);
  --intent-danger-fg:#e87b7b;
  --intent-danger-bg:rgba(232,123,123,.12);
  --intent-info-fg:#7bb8e8;
  --intent-info-bg:rgba(123,184,232,.12);
  --shadow-md:0 4px 14px rgba(0,0,0,.30);
  --shadow-lg:0 8px 24px rgba(0,0,0,.40);
  --shadow-xl:0 20px 60px rgba(0,0,0,.55);
  --glass-alpha:.04;
  --glass-border:.10;
  --glass-blur:22px;
}
:root[data-theme="light"]{
  --bg-canvas:#f4f6f9;
  --bg-surface:#ffffff;
  --bg-surface-muted:#f7f8fa;
  --bg-overlay:rgba(255,255,255,.78);
  --fg-default:#0d1117;
  --fg-muted:#586069;
  --fg-subtle:#8b949e;
  --fg-on-accent:#06120a;
  --border-default:rgba(0,0,0,.08);
  --border-muted:rgba(0,0,0,.04);
  --border-strong:rgba(0,0,0,.16);
  --border-focus:#4f9a5c;
  --accent:#3f8a4d;
  --accent-hi:#4f9a5c;
  --accent-glow:rgba(79,154,92,.20);
  --intent-success-fg:#1e7a35;
  --intent-success-bg:rgba(79,154,92,.10);
  --intent-warn-fg:#a07020;
  --intent-warn-bg:rgba(224,184,107,.18);
  --intent-danger-fg:#b13b3b;
  --intent-danger-bg:rgba(232,123,123,.14);
  --intent-info-fg:#2c6fb0;
  --intent-info-bg:rgba(123,184,232,.16);
  --shadow-md:0 4px 14px rgba(0,0,0,.06);
  --shadow-lg:0 8px 24px rgba(0,0,0,.08);
  --shadow-xl:0 20px 60px rgba(0,0,0,.12);
  --glass-alpha:.65;
  --glass-border:.40;
  --glass-blur:22px;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{color-scheme:dark light}
body{
  font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:13px;line-height:1.5;
  background:var(--bg-canvas);
  color:var(--fg-default);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-0.005em;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* ─── Ambient background ───────────────────────────────── */
.aurora{
  position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
}
.aurora::before,.aurora::after{
  content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;
}
.aurora::before{
  width:680px;height:680px;left:-180px;top:-180px;
  background:radial-gradient(circle,rgba(79,154,92,.35),transparent 60%);
  animation:aurora-shift 14s ease-in-out infinite alternate;
}
.aurora::after{
  width:560px;height:560px;right:-160px;bottom:-160px;
  background:radial-gradient(circle,rgba(123,184,232,.25),transparent 60%);
  animation:aurora-shift 16s ease-in-out infinite alternate-reverse;
}
:root[data-theme="light"] .aurora::before{opacity:.40}
:root[data-theme="light"] .aurora::after{opacity:.35}
@keyframes aurora-shift{
  0%{transform:translate3d(0,0,0) scale(1)}
  100%{transform:translate3d(40px,30px,0) scale(1.08)}
}

.grid-bg{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);
}
:root[data-theme="light"] .grid-bg{
  background-image:
    linear-gradient(rgba(0,0,0,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,0,0,.04) 1px,transparent 1px);
}

/* ─── Glass surfaces ──────────────────────────────────── */
.glass{
  background-color:rgba(255,255,255,var(--glass-alpha));
  border:1px solid rgba(255,255,255,var(--glass-border));
  backdrop-filter:blur(var(--glass-blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%);
  border-radius:24px;
}
:root[data-theme="light"] .glass{
  background-color:rgba(255,255,255,.65);
  border-color:rgba(0,0,0,.06);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset, var(--shadow-md);
}

.card{
  background:var(--bg-surface);
  border:1px solid var(--border-default);
  border-radius:16px;
}
.card-muted{
  background:var(--bg-surface-muted);
  border:1px solid var(--border-muted);
  border-radius:12px;
}

/* ─── Buttons ─────────────────────────────────────────── */
.btn{
  position:relative;display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:10px;font-size:12px;font-weight:500;
  border:1px solid var(--border-default);
  background:var(--bg-surface-muted);
  color:var(--fg-default);
  cursor:pointer;
  transition:all 180ms cubic-bezier(0.22,1,0.36,1);
  white-space:nowrap;
}
.btn:hover{border-color:var(--border-strong);background:var(--bg-surface)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--border-focus)}
.btn-primary{
  background:var(--accent);
  color:var(--fg-on-accent);
  border-color:transparent;
  font-weight:600;
}
.btn-primary:hover{background:var(--accent-hi);box-shadow:0 4px 18px var(--accent-glow)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--border-muted)}
.btn-danger{
  background:var(--intent-danger-bg);
  color:var(--intent-danger-fg);
  border-color:rgba(232,123,123,.2);
}
.btn-danger:hover{background:rgba(232,123,123,.18)}
.btn-lg{padding:11px 18px;font-size:13px;border-radius:12px}
.btn-block{width:100%;justify-content:center}

/* ─── Inputs ─────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:6px}
.field-label{
  font-size:11px;font-weight:500;color:var(--fg-muted);
  letter-spacing:.02em;
}
.field-row{display:flex;gap:8px}

.input{
  width:100%;padding:11px 14px;
  background:var(--bg-surface-muted);
  border:1px solid var(--border-default);
  border-radius:10px;font-size:13px;color:var(--fg-default);
  transition:all 180ms cubic-bezier(0.22,1,0.36,1);
}
.input::placeholder{color:var(--fg-subtle)}
.input:hover{border-color:var(--border-strong)}
.input:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-glow);
  background:var(--bg-surface);
}
.input-group{position:relative}
.input-group .input{padding-left:38px}
.input-group .icon{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--fg-subtle);width:16px;height:16px;
}
.input-group .trailing{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  display:flex;gap:4px;
}

.field-hint{font-size:11px;color:var(--fg-subtle);margin-top:2px}
.field-error{font-size:11px;color:var(--intent-danger-fg);margin-top:2px}

/* ─── Misc atoms ─────────────────────────────────────── */
.kbd{
  display:inline-flex;align-items:center;
  padding:1px 5px;border-radius:4px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10px;font-weight:600;
  background:var(--bg-surface-muted);
  border:1px solid var(--border-default);
  color:var(--fg-muted);
}
.divider{
  display:flex;align-items:center;gap:10px;
  font-size:11px;color:var(--fg-subtle);text-transform:uppercase;letter-spacing:.1em;
}
.divider::before,.divider::after{
  content:"";flex:1;height:1px;background:var(--border-default);
}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:9999px;
  font-size:10px;font-weight:600;letter-spacing:.02em;
  border:1px solid var(--border-default);
  background:var(--bg-surface-muted);
  color:var(--fg-muted);
}
.badge-success{background:var(--intent-success-bg);color:var(--intent-success-fg);border-color:rgba(79,154,92,.25)}
.badge-warn{background:var(--intent-warn-bg);color:var(--intent-warn-fg);border-color:rgba(224,184,107,.25)}
.badge-danger{background:var(--intent-danger-bg);color:var(--intent-danger-fg);border-color:rgba(232,123,123,.25)}
.badge-info{background:var(--intent-info-bg);color:var(--intent-info-fg);border-color:rgba(123,184,232,.25)}
.badge-accent{background:rgba(79,154,92,.14);color:var(--accent-hi);border-color:rgba(79,154,92,.30)}

.dot{display:inline-block;width:6px;height:6px;border-radius:9999px;background:currentColor}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.switch{
  position:relative;width:34px;height:20px;
  background:var(--border-default);border-radius:9999px;cursor:pointer;
  transition:background 180ms;
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;
  width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);
  transition:left 180ms cubic-bezier(0.22,1,0.36,1);
}
.switch.on{background:var(--accent)}
.switch.on::after{left:16px}

/* ─── App shell ──────────────────────────────────────── */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{
  border-right:1px solid var(--border-default);
  background:linear-gradient(180deg,var(--bg-surface) 0%, var(--bg-canvas) 100%);
  padding:16px 12px;
  display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:6px 8px 14px;
  border-bottom:1px solid var(--border-muted);
  margin-bottom:10px;
}
.brand-mark{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent) 0%,#2c5e36 100%);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 12px var(--accent-glow);
}
.brand-name{font-size:13px;font-weight:600;letter-spacing:-.01em}
.brand-sub{font-size:10px;color:var(--fg-subtle);letter-spacing:.04em;text-transform:uppercase}

.nav-section-label{
  font-size:10px;color:var(--fg-subtle);
  text-transform:uppercase;letter-spacing:.08em;font-weight:600;
  padding:14px 10px 6px;
}
.nav-link{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:8px;
  font-size:12px;font-weight:500;color:var(--fg-muted);
  cursor:pointer;
  transition:all 120ms cubic-bezier(0.22,1,0.36,1);
}
.nav-link:hover{background:var(--border-muted);color:var(--fg-default)}
.nav-link.active{
  background:var(--bg-surface-muted);color:var(--fg-default);
  border:1px solid var(--border-default);
  box-shadow:inset 0 0 0 1px rgba(79,154,92,.12);
}
.nav-link .icon{width:14px;height:14px;flex-shrink:0;opacity:.85}
.nav-link.active .icon{color:var(--accent-hi);opacity:1}
.nav-link .count{
  margin-left:auto;font-size:10px;
  padding:1px 6px;border-radius:9999px;
  background:var(--bg-surface-muted);color:var(--fg-subtle);
  border:1px solid var(--border-muted);
}

.sidebar-foot{margin-top:auto;border-top:1px solid var(--border-muted);padding-top:10px}
.user-chip{
  display:flex;align-items:center;gap:10px;padding:8px;
  border-radius:10px;cursor:pointer;
  transition:background 120ms;
}
.user-chip:hover{background:var(--border-muted)}
.avatar{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#7bb8e8,#4f9a5c);
  display:grid;place-items:center;color:#fff;font-weight:600;font-size:11px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
}
.avatar-lg{width:64px;height:64px;font-size:22px;border-radius:14px}

/* ─── Main pane ──────────────────────────────────────── */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:12px 24px;
  border-bottom:1px solid var(--border-default);
  background:var(--bg-overlay);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:10;
}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-muted)}
.crumbs .sep{color:var(--fg-subtle)}
.crumbs .here{color:var(--fg-default);font-weight:500}
.search{
  flex:1;max-width:380px;margin-left:8px;position:relative;
}
.search input{
  width:100%;padding:7px 10px 7px 32px;font-size:12px;
  background:var(--bg-surface-muted);border:1px solid var(--border-default);
  border-radius:8px;color:var(--fg-default);
}
.search .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--fg-subtle)}
.search .kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{
  width:32px;height:32px;border-radius:8px;
  display:grid;place-items:center;cursor:pointer;
  border:1px solid transparent;color:var(--fg-muted);
  transition:all 120ms;
  position:relative;
}
.icon-btn:hover{background:var(--border-muted);color:var(--fg-default)}
.icon-btn .dot-indicator{
  position:absolute;top:6px;right:6px;
  width:6px;height:6px;border-radius:50%;background:var(--accent-hi);
  box-shadow:0 0 0 2px var(--bg-surface);
}

.content{padding:28px 28px 60px;max-width:1080px;width:100%;margin:0 auto}
.page-header{margin-bottom:24px}
.page-title{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
.page-sub{font-size:13px;color:var(--fg-muted);margin-top:4px}

/* Section header for cards */
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border-muted);
}
.section-title{font-size:14px;font-weight:600;letter-spacing:-.01em;margin:0}
.section-sub{font-size:11px;color:var(--fg-muted);margin-top:2px}
.section-body{padding:20px}

.row-list>.row+.row{border-top:1px solid var(--border-muted)}
.row{
  display:flex;align-items:center;gap:14px;
  padding:14px 20px;
  transition:background 120ms;
}
.row:hover{background:var(--border-muted)}
.row .row-main{flex:1;min-width:0}
.row .row-title{font-size:13px;font-weight:500}
.row .row-meta{font-size:11px;color:var(--fg-muted);margin-top:2px}

/* ─── Auth shell ─────────────────────────────────────── */
.auth-shell{
  min-height:100vh;display:grid;place-items:center;
  padding:24px;position:relative;
}
.auth-card{
  width:100%;max-width:420px;
  padding:32px;
  animation:rise 520ms cubic-bezier(0.22,1,0.36,1) both;
}
.auth-card.wide{max-width:780px}
.auth-head{text-align:center;margin-bottom:24px}
.auth-head .brand-mark{margin:0 auto 14px}
.auth-title{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
.auth-sub{font-size:13px;color:var(--fg-muted);margin-top:6px}

.auth-foot{
  text-align:center;margin-top:18px;font-size:12px;color:var(--fg-muted);
}
.auth-foot a{color:var(--accent-hi);font-weight:500;cursor:pointer}
.auth-foot a:hover{text-decoration:underline}

.auth-back{
  position:absolute;top:24px;left:24px;
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;color:var(--fg-muted);cursor:pointer;
  padding:6px 10px;border-radius:8px;
}
.auth-back:hover{background:var(--border-muted);color:var(--fg-default)}

.theme-toggle{
  position:absolute;top:24px;right:24px;
  width:34px;height:34px;border-radius:10px;
  display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--border-default);background:var(--bg-surface-muted);
  color:var(--fg-muted);transition:all 120ms;
}
.theme-toggle:hover{color:var(--fg-default);border-color:var(--border-strong)}

@keyframes rise{
  from{opacity:0;transform:translate3d(0,12px,0)}
  to{opacity:1;transform:translate3d(0,0,0)}
}
.rise-1{animation-delay:60ms}
.rise-2{animation-delay:120ms}
.rise-3{animation-delay:180ms}

/* OTP grid */
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp input{
  width:100%;aspect-ratio:1/1.15;
  text-align:center;font-size:20px;font-weight:600;
  background:var(--bg-surface-muted);
  border:1px solid var(--border-default);
  border-radius:12px;color:var(--fg-default);
  transition:all 180ms cubic-bezier(0.22,1,0.36,1);
}
.otp input:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-glow);
  background:var(--bg-surface);
}
.otp input.filled{border-color:var(--accent);color:var(--accent-hi)}

/* Password strength */
.strength{display:flex;gap:4px;margin-top:8px}
.strength-bar{
  flex:1;height:3px;border-radius:9999px;
  background:var(--border-default);
  transition:background 200ms;
}
.strength-bar.s1{background:var(--intent-danger-fg)}
.strength-bar.s2{background:var(--intent-warn-fg)}
.strength-bar.s3{background:var(--accent-hi)}
.strength-label{font-size:11px;color:var(--fg-muted);margin-top:6px}

/* SSO buttons */
.sso-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-sso{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 14px;border-radius:10px;font-size:12px;font-weight:500;
  border:1px solid var(--border-default);
  background:var(--bg-surface-muted);
  color:var(--fg-default);cursor:pointer;
  transition:all 180ms cubic-bezier(0.22,1,0.36,1);
}
.btn-sso:hover{background:var(--bg-surface);border-color:var(--border-strong)}
.btn-sso svg{width:14px;height:14px}

/* Plan cards */
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.plan{
  padding:20px;border-radius:14px;
  background:var(--bg-surface);border:1px solid var(--border-default);
  position:relative;cursor:pointer;
  transition:all 180ms cubic-bezier(0.22,1,0.36,1);
}
.plan:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.plan.current{
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent),0 8px 24px var(--accent-glow);
}
.plan-badge{
  position:absolute;top:-9px;right:14px;
  padding:2px 9px;border-radius:9999px;font-size:10px;font-weight:600;
  background:var(--accent);color:var(--fg-on-accent);
  letter-spacing:.04em;
}
.plan-name{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--fg-muted)}
.plan-price{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.plan-price small{font-size:12px;color:var(--fg-muted);font-weight:500}
.plan-list{list-style:none;padding:14px 0 0;margin:0;display:flex;flex-direction:column;gap:8px}
.plan-list li{font-size:12px;color:var(--fg-muted);display:flex;gap:8px;align-items:flex-start}
.plan-list li svg{flex-shrink:0;margin-top:2px;color:var(--accent-hi)}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-default);margin-bottom:20px;overflow-x:auto}
.tab{
  padding:10px 14px;font-size:12px;font-weight:500;color:var(--fg-muted);
  cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-1px;white-space:nowrap;
  transition:all 120ms;
}
.tab:hover{color:var(--fg-default)}
.tab.active{color:var(--fg-default);border-bottom-color:var(--accent)}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{padding:16px;border-radius:12px;background:var(--bg-surface);border:1px solid var(--border-default)}
.stat-label{font-size:11px;color:var(--fg-muted);font-weight:500}
.stat-value{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.stat-trend{font-size:11px;margin-top:6px;display:flex;align-items:center;gap:4px}

/* Table */
.table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.table th{
  text-align:left;padding:10px 14px;font-weight:500;color:var(--fg-muted);
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  background:var(--bg-surface-muted);
  border-top:1px solid var(--border-default);
  border-bottom:1px solid var(--border-default);
}
.table th:first-child{border-left:1px solid var(--border-default);border-top-left-radius:8px}
.table th:last-child{border-right:1px solid var(--border-default);border-top-right-radius:8px}
.table td{
  padding:12px 14px;border-bottom:1px solid var(--border-muted);
  vertical-align:middle;
}
.table tr:last-child td{border-bottom:none}
.table tr:last-child td:first-child{border-bottom-left-radius:8px}
.table tr:last-child td:last-child{border-bottom-right-radius:8px}
.table tbody tr{transition:background 120ms}
.table tbody tr:hover{background:var(--border-muted)}

.table-wrap{
  border:1px solid var(--border-default);border-top:none;
  border-radius:8px;overflow:hidden;
}

/* Mono */
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:-.01em}

/* Toast */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:100;
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:10px;font-size:12px;
  background:var(--bg-surface);border:1px solid var(--border-default);
  box-shadow:var(--shadow-lg);
  animation:rise 320ms cubic-bezier(0.22,1,0.36,1);
}
.toast.success{border-color:rgba(79,154,92,.4)}
.toast .icon{color:var(--accent-hi)}

/* Responsive */
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .plan-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}

/* Hide scrollbar */
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(127,127,127,.22);border-radius:9999px}
*::-webkit-scrollbar-thumb:hover{background:rgba(127,127,127,.4)}

/* Skeleton shimmer for empty states */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* Reduce motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ─────────────────────────────────────────────────────────
   Theme toggle
   ───────────────────────────────────────────────────────── */
function getTheme(){return document.documentElement.dataset.theme || 'dark'}
function setTheme(t){
  document.documentElement.dataset.theme = t;
  try{localStorage.setItem('account:theme', t)}catch(e){}
  // Rerender so any nested icons update
  render();
}
try{
  const t = localStorage.getItem('account:theme');
  if(t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
}catch(e){}

/* ─────────────────────────────────────────────────────────
   Toast
   ───────────────────────────────────────────────────────── */
function toast(msg, kind = 'success'){
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `${I('check-circle')}<span>${msg}</span>`;
  document.body.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity 200ms, transform 200ms';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(() => el.remove(), 220);
  }, 2400);
}

/* ─────────────────────────────────────────────────────────
   Router (hash-based)
   ───────────────────────────────────────────────────────── */
const ROUTES = [
  { path: '#/signin',          render: SignInPage,         layout: 'auth' },
  { path: '#/signup',          render: SignUpPage,         layout: 'auth' },
  { path: '#/2fa',             render: TwoFactorPage,      layout: 'auth' },
  { path: '#/forgot',          render: ForgotPage,         layout: 'auth' },
  { path: '#/reset',           render: ResetPasswordPage,  layout: 'auth' },
  { path: '#/sso',             render: SSOPage,            layout: 'auth' },
  { path: '#/welcome',         render: WelcomePage,        layout: 'auth' },
  { path: '#/account',         render: ProfilePage,        layout: 'app', nav: 'profile' },
  { path: '#/account/profile', render: ProfilePage,        layout: 'app', nav: 'profile' },
  { path: '#/account/security',render: SecurityPage,       layout: 'app', nav: 'security' },
  { path: '#/account/sessions',render: SessionsPage,       layout: 'app', nav: 'sessions' },
  { path: '#/account/billing', render: BillingPage,        layout: 'app', nav: 'billing' },
  { path: '#/account/team',    render: TeamPage,           layout: 'app', nav: 'team' },
  { path: '#/account/api-keys',render: ApiKeysPage,        layout: 'app', nav: 'api-keys' },
  { path: '#/account/notifications', render: NotificationsPage, layout: 'app', nav: 'notifications' },
  { path: '#/account/audit',   render: AuditPage,          layout: 'app', nav: 'audit' },
];

function nav(p){location.hash = p}

function render(){
  let hash = location.hash || '#/signin';
  let route = ROUTES.find(r => r.path === hash) || ROUTES[0];
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(route.layout === 'auth'){
    app.appendChild(AuthLayout(route.render()));
  } else {
    app.appendChild(AppLayout(route));
  }
  // wire global handlers
  wireGlobal(app);
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  if(!location.hash) location.hash = '#/signin';
  render();
});

function wireGlobal(root){
  root.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', (e) => { e.preventDefault(); nav(el.dataset.nav); });
  });
  root.querySelectorAll('[data-toast]').forEach(el => {
    el.addEventListener('click', () => toast(el.dataset.toast));
  });
  root.querySelectorAll('[data-toggle-theme]').forEach(el => {
    el.addEventListener('click', () => setTheme(getTheme() === 'dark' ? 'light' : 'dark'));
  });
  root.querySelectorAll('[data-switch]').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('on'));
  });
  // Tabs (simple)
  root.querySelectorAll('[data-tabs]').forEach(group => {
    group.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        group.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
      });
    });
  });
}

/* ─────────────────────────────────────────────────────────
   Helpers
   ───────────────────────────────────────────────────────── */
function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

/* ─────────────────────────────────────────────────────────
   Auth layout shell
   ───────────────────────────────────────────────────────── */
function AuthLayout(inner){
  const wrap = el(`
    <div class="auth-shell">
      <a class="auth-back" data-nav="#/signin" href="#">
        ${I('arrow-left',14)}<span>Back</span>
      </a>
      <button class="theme-toggle" data-toggle-theme aria-label="Toggle theme">
        ${getTheme() === 'dark' ? I('sun',16) : I('moon',16)}
      </button>
      <div></div>
    </div>
  `);
  wrap.querySelector('div:last-child').appendChild(inner);
  return wrap;
}

  const pw = node.querySelector('#pw2');
  const bars = node.querySelectorAll('.strength-bar');
  const lbl = node.querySelector('#strength-label');
  pw.addEventListener('input', () => {
    const v = pw.value;
    let s = 0;

    if(/[A-Z]/.test(v) && /[0-9]/.test(v)) s++;
    if(v.length >= 12 && /[^A-Za-z0-9]/.test(v)) s++;
    bars.forEach((b,i) => {
      b.classList.remove('s1','s2','s3');
      if(i < s) b.classList.add(['s1','s2','s3'][s-1]);
    });
    lbl.textContent = ['Use 10+ characters with a mix of letters, numbers & symbols.',
                       'Weak — add length and variety.',
                       'Decent — keep going for stronger.',
                       'Strong — looks great.'][s];
  });

function TwoFactorPage(){
  const node = el(`
    <div class="glass auth-card">
      ${AuthHead('Two-factor verification', 'Enter the 6-digit code from your authenticator app')}

      <div class="otp" id="otp" style="margin:14px 0 6px">
        ${[0,1,2,3,4,5].map(i => `<input maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-i="${i}" />`).join('')}
      </div>
      <div class="field-hint" style="text-align:center;margin-bottom:18px">
        Code expires in <span id="countdown" style="color:var(--fg-default);font-weight:500">29s</span>
      </div>

      <button class="btn btn-primary btn-lg btn-block" id="verify-btn" disabled style="opacity:.5;cursor:not-allowed">
        <span>Verify and continue</span>${I('arrow',14)}
      </button>

      <div style="text-align:center;margin-top:14px;font-size:12px;color:var(--fg-muted)">
        Didn't get a code? <a class="auth-foot" style="margin:0;font-size:12px" href="#">Resend</a> ·
        <a class="auth-foot" style="margin:0;font-size:12px" href="#">Use recovery key</a>
      </div>

      <div class="auth-foot">
        <a data-nav="#/signin" href="#">Sign in with another account</a>
      </div>
    </div>
  `);

  const inputs = node.querySelectorAll('.otp input');
  const verify = node.querySelector('#verify-btn');
  const cd = node.querySelector('#countdown');

  inputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g,'').slice(0,1);
      if(inp.value){ inp.classList.add('filled'); if(i < 5) inputs[i+1].focus(); }
      else inp.classList.remove('filled');
      const all = [...inputs].every(x => x.value);
      verify.disabled = !all;
      verify.style.opacity = all ? 1 : .5;
      verify.style.cursor = all ? 'pointer' : 'not-allowed';
    });
    inp.addEventListener('keydown', (e) => {
      if(e.key === 'Backspace' && !inp.value && i > 0) inputs[i-1].focus();
    });
    inp.addEventListener('paste', (e) => {
      const txt = (e.clipboardData.getData('text') || '').replace(/\D/g,'').slice(0,6);
      if(!txt) return;
      e.preventDefault();
      [...txt].forEach((c, k) => { if(inputs[k]){ inputs[k].value = c; inputs[k].classList.add('filled'); }});
      inputs[Math.min(txt.length, 5)].focus();
      verify.disabled = txt.length < 6;
      verify.style.opacity = txt.length < 6 ? .5 : 1;
      verify.style.cursor = txt.length < 6 ? 'not-allowed' : 'pointer';
    });
  });

  let s = 29;
  const t = setInterval(() => {
    s--;
    if(s < 0){ s = 29; }
    cd.textContent = s + 's';
  }, 1000);

  verify.addEventListener('click', () => {
    if(verify.disabled) return;
    clearInterval(t);
    nav('#/account/profile');
  });

  setTimeout(() => inputs[0].focus(), 100);
  return node;
}
