name: Native UI E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/shared/ui/**'
      - 'src/shared/lib/useShortcut.ts'
      - 'src/widgets/app-shell/**'
      - 'e2e/tauri/**'
      - 'wdio.conf.ts'

jobs:
  tauri-webdriver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri and WebDriver system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: cargo install tauri-driver --locked
      - run: pnpm tauri:build:debug
      - run: xvfb-run -a pnpm test:tauri
