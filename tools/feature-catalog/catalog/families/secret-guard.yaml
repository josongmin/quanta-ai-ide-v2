# Secret & PII guard — composer-time DLP.

- id: secret-pattern-scan
  label: Pattern + entropy secret scan
  tier: leading
  description: >-
    GitHub Secret Scanning's published pattern set (OpenAI, Anthropic, AWS,
    GitHub PAT, JWT) plus PII (email, US SSN, credit-card). High-entropy
    regexes use a Shannon-entropy gate so plain English doesn't false-positive.
  evidence:
    symbols:
      - src/shared/lib/redact.ts::scanForSecrets
      - src/shared/lib/redact.ts::shannonEntropy
      - src/shared/lib/redact.ts::BUILT_IN_PATTERNS
    locales:
      - "coding:secretGuard.tooltip"
  pattern:
    source: GitHub Secret Scanning + Trufflehog entropy gate
    rationale: >-
      Prefix-anchored regexes (sk-, AKIA, ghp_) are the only false-positive
      -free option for LLM-credential detection. Entropy is the standard
      tiebreaker for unprefixed shapes (JWTs, credit cards).
  sota: {}
  added_in: "2026-05-05"
  flags: ["security"]

- id: secret-three-tier
  label: 3-tier severity (critical / warn / info)
  tier: leading
  description: >-
    Critical matches block submit and demand mask-or-cancel. Warn matches
    surface a soft modal that allows send-as-is once. Info is silent — log
    only. Mirrors Slack DLP's three-tier escalation.
  evidence:
    symbols:
      - src/shared/lib/redact.ts::SecretPattern
      - src/widgets/coding-stage/parts/Composer.tsx::guardedSubmit
  pattern:
    source: Slack DLP banner + 1Password vault paste warning
    rationale: >-
      Hard-blocking PII (e.g. emails) would create a workaround culture
      ("just remove the @"). Tiering preserves friction-where-it-matters.
  sota: {}
  added_in: "2026-05-05"
  flags: ["security", "a11y"]
  related: ["secret-pattern-scan"]

- id: secret-mask-modal
  label: Mask-and-send modal
  tier: leading
  description: >-
    On critical match the composer pops a modal floating just above the
    textarea, listing each detected secret with its first 4 chars + an
    ellipsis. Three actions: Mask & send (safe default, autofocus),
    Send as-is (warn-tier only), Cancel. Esc cancels, Enter masks.
  evidence:
    symbols:
      - src/widgets/coding-stage/parts/Composer.tsx::SecretChallengeModal
    locales:
      - "coding:secretGuard.blockTitle"
      - "coding:secretGuard.maskNow"
  pattern:
    source: 1Password autofill confirm
    rationale: >-
      Showing the first 4 chars confirms detection without revealing the
      whole token. Mask is the safe default to make the right thing easy.
  sota: {}
  added_in: "2026-05-05"
  related: ["secret-three-tier"]

- id: secret-redact-replace
  label: Deterministic placeholder replacement
  tier: leading
  description: >-
    `redactText` walks the matches in source order and replaces each value
    with `[REDACTED:<kind>]`, returning the new string plus a parallel list
    of placeholders carrying the original for one-shot reveal. The kind
    suffix keeps the agent's reasoning stable ("the user gave me a token
    here") without leaking the value.
  evidence:
    symbols:
      - src/shared/lib/redact.ts::redactText
  pattern:
    source: Bitwarden one-shot reveal
    rationale: >-
      Reveal-once with copy disabled and a 600ms auto-hide is the modern
      vault-reveal lineage. Survives shoulder-surfing and screen recorders.
  sota: {}
  added_in: "2026-05-05"
  flags: ["security"]
  related: ["secret-mask-modal"]
